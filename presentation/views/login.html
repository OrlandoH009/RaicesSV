<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raíces SV — Iniciar Sesión</title>
  <link rel="stylesheet" href="/presentation/assets/css/global.css" />
  <link rel="stylesheet" href="/presentation/assets/css/login.css" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="navbar__logo"><a href="/presentation/views/index.html"><img src="/presentation/assets/media/Logo de Raíces SV (Sin Fondo).png" alt="Logo Raíces SV" /></a></div>
    <ul class="navbar__links">
      <li><a href="/presentation/views/index.html">Inicio</a></li>
      <li><a href="/presentation/views/categorias.html">Categorías</a></li>
      <li><a href="/presentation/views/mapa.html">Mapa</a></li>
    </ul>
    <button class="navbar__burger" id="burger" aria-label="Abrir menú"><span></span><span></span><span></span></button>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-drawer__head"><span>Menú</span></div>
    <a href="/presentation/views/sitios-culturales.html" class="drawer-link">Sitios Culturales</a>
    <a href="/presentation/views/gastronomia.html" class="drawer-link">Gastronomía</a>
    <a href="/presentation/views/eventos.html" class="drawer-link">Eventos Culturales</a>
    <a href="/presentation/views/historia.html" class="drawer-link">Historia</a>
    <a href="/presentation/views/quiz.html" class="drawer-link">Quiz Cultural</a>
    <div class="drawer-divider"></div>
    <div class="drawer-auth">
      <p class="drawer-auth-label">Mi cuenta</p>
      <a href="/presentation/views/login.html" class="btn-login">Iniciar Sesión</a>
      <a href="/presentation/views/registro.html" class="btn-register">Registrarse</a>
    </div>
  </nav>

  <!-- Fondo semitransparente -->
  <div class="auth-page__bg"></div>

  <main class="auth-page">
    <div class="auth-card reveal">
      <div class="auth-card__logo">
        <img src="/presentation/assets/media/Logo de Raíces SV (Sin Fondo).png" alt="Logo Raíces SV" />
      </div>
      <h1>Iniciar Sesión</h1>
      <p class="auth-card__sub">Nuestra herencia, nuestro orgullo.</p>

      <form action="#" method="post" onsubmit="return false;">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="auth-submit">Entrar</button>
      </form>

      <div class="auth-divider"><span>¿Aún no tienes cuenta?</span></div>

      <p class="auth-footer-link">
        Regístrate gratis → <a href="/presentation/views/registro.html">Crear cuenta</a>
      </p>
    </div>
  </main>

  <script src="/presentation/assets/js/login.js"></script>
  <script src="/presentation/assets/js/script.js"></script>
</body>
</html>
