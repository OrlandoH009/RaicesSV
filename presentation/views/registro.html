<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salvadorean Roots — Registrarse</title>
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/registro.css" />
  <link rel="icon" href="../assets/favicon/favicon.ico" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="navbar__logo">
      <a href="index.html">
        <img src="../assets/media/Logo de Salvadorean Roots (Sin Fondo).png" alt="Logo Salvadorean Roots" data-i18n-attr="alt:home.logoAlt" />
      </a>
    </div>
    <ul class="navbar__links">
      <li><a href="../views/index.html" class="active" data-i18n="nav.inicio">Inicio</a></li>
      <li><a href="../views/categorias.html" data-i18n="nav.categorias">Categorías</a></li>
      <li><a href="../views/mapa.html" data-i18n="nav.mapa">Mapa</a></li>
      <li><a href="../views/calendario.html" data-i18n="nav.calendario">Calendario</a></li>
    </ul>

    <button class="lang-toggle" id="langToggleDesktop" data-lang-toggle type="button">
      <span class="lang-toggle__flag" data-lang-toggle-flag>🇸🇻</span>
    </button>

    <button class="navbar__burger" id="burger" aria-label="Abrir menú" data-i18n-attr="aria-label:nav.abrirMenu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-drawer__head"><span data-i18n="nav.menu">Menú</span></div>
    <div class="drawer-section-label" data-i18n="nav.principal">Principal</div>
    <a href="../views/index.html" class="drawer-link active" data-i18n="nav.inicio">Inicio</a>
    <a href="../views/categorias.html" class="drawer-link" data-i18n="nav.categorias">Categorías</a>
    <a href="../views/mapa.html" class="drawer-link" data-i18n="nav.mapa">Mapa</a>
    <a href="../views/calendario.html" class="drawer-link" data-i18n="nav.calendario">Calendario</a>
    <div class="drawer-divider"></div>
    <div class="drawer-section-label" data-i18n="nav.explorar">Explorar</div>
    <div class="drawer-divider"></div>

    <button class="lang-toggle" id="langToggleMobile" data-lang-toggle type="button">
      <span class="lang-toggle__flag" data-lang-toggle-flag>🇸🇻</span>
    </button>

    <div class="drawer-divider"></div>
    <div class="drawer-auth">
      <p class="drawer-auth-label" data-i18n="nav.miCuenta">Mi cuenta</p>
      <a href="../views/login.html" class="btn-login" data-i18n="nav.iniciarSesion">Iniciar Sesión</a>
      <a href="../views/registro.html" class="btn-register" data-i18n="nav.registrarse">Registrarse</a>
    </div>
  </nav>

  <div class="auth-page__bg"></div>

  <main class="auth-page">
    <div class="auth-card reveal">
      <div class="auth-card__logo">
        <img src="../assets/media/Logo de Salvadorean Roots (Sin Fondo).png" alt="Logo Salvadorean Roots" />
      </div>
      <h1 data-i18n="register.title">Crear Cuenta</h1>
      <p class="auth-card__sub" data-i18n="register.subtitle">Únete a la comunidad de Salvadorean Roots</p>

      <form id="register-form" action="/register" method="post">
        <div id="form-message" class="auth-message" role="alert" style="display:none; margin-bottom: 1rem;"></div>

        <div class="form-row">
          <div class="form-group">
            <label for="nombre" data-i18n="register.label_name">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required data-i18n-attr="placeholder:register.placeholder_name" />
          </div>
          <div class="form-group">
            <label for="apellido" data-i18n="register.label_lastname">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required data-i18n-attr="placeholder:register.placeholder_lastname" />
          </div>
        </div>

        <div class="form-group">
          <label for="email" data-i18n="register.label_email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email" data-i18n-attr="placeholder:register.placeholder_email" />
        </div>

        <div class="form-group">
          <label for="password" data-i18n="register.label_password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password" data-i18n-attr="placeholder:register.placeholder_password" />
        </div>

        <div class="form-group">
          <label for="password2" data-i18n="register.label_confirm">Confirmar contraseña</label>
          <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" required autocomplete="new-password" data-i18n-attr="placeholder:register.placeholder_confirm" />
        </div>

        <button type="submit" class="auth-submit" data-i18n="register.submit_btn">Crear mi cuenta</button>
      </form>

      <a href="/auth/google" class="auth-google-btn-full">
        <span class="google-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
          </svg>
        </span>
        <span class="google-text" data-i18n="register.google_btn">Regístrate con Google</span>
      </a>

      <p class="auth-footer-link" data-i18n="register.footer_text">
        ¿Ya tienes cuenta? <a href="../views/login.html" data-i18n="register.footer_link">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../assets/js/theme-blobs.js"></script>
  <script src="../assets/js/i18n.js"></script>   <!-- ← i18n ANTES de registro.js -->
  <script src="../assets/js/registro.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
