<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raíces SV — Registrarse</title>
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/registro.css" />
  <link rel="icon" href="../assets/favicon/favicon.ico" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>

<nav class="navbar" id="navbar">
    <div class="navbar__logo">
      <a href="../views/index.html">
        <img src="../assets/media/Logo de Raíces SV (Sin Fondo).png" alt="Logo Raíces SV" />
      </a>
    </div>
    <ul class="navbar__links">
      <li><a href="../views/index.html">Inicio</a></li>
      <li><a href="../views/categorias.html">Categorías</a></li>
      <li><a href="../views/mapa.html">Mapa</a></li>
      <li><a href="../views/calendario.html">Calendario</a></li>
    </ul>
    <button class="navbar__burger" id="burger" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-drawer__head"><span>Menú</span></div>
    <a href="../views/categorias.html" class="drawer-link">Categorías</a>
    <div class="drawer-divider"></div>
    <div class="drawer-auth">
      <p class="drawer-auth-label">Mi cuenta</p>
      <a href="../views/login.html" class="btn-login">Iniciar Sesión</a>
      <a href="../views/registro.html" class="btn-register">Registrarse</a>
    </div>
  </nav>

  <div class="auth-page__bg"></div>

  <main class="auth-page">
    <div class="auth-card reveal">
      <div class="auth-card__logo">
        <img src="../assets/media/Logo de Raíces SV (Sin Fondo).png" alt="Logo Raíces SV">
      </div>
      <h1>Crear Cuenta</h1>
      <p class="auth-card__sub">Únete a la comunidad de Raíces SV</p>

      <form id="register-form" action="/register" method="post">
        <div id="form-message" class="auth-message" role="alert" style="display:none; margin-bottom: 1rem;"></div>

        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 5 caracteres" required minlength="5" />
        </div>

        <div class="form-group">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" required />
        </div>

        <div class="terms-check">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">
            Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a> de Raíces SV.
          </label>
        </div>

        <button type="submit" class="auth-submit">Crear mi cuenta</button>
      </form>

      <div class="auth-divider"><span>¿Ya tienes cuenta?</span></div>

      <p class="auth-footer-link">
        Inicia sesión → <a href="../views/login.html">Entrar</a>
      </p>
    </div>
  </main>

  <script src="../assets/js/registro.js"></script>
  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/chatbot.js"></script>
</body>
</html>
