<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apelar suspensión — Salvadorean Roots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/apelar.css" />
  <link rel="icon" href="../assets/favicon/favicon.ico" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <meta name="theme-color" content="#0f2f66" />
</head>
<body class="appeal-body" data-gsap-reveal data-i18n-title="appeal.meta.title">

  <div class="appeal-page">
    <div class="appeal-page__bg"></div>

    <main class="appeal-card">
      <button class="lang-toggle appeal-lang-toggle" data-lang-toggle type="button">
        <span class="lang-toggle__flag" data-lang-toggle-flag>🇸🇻</span>
      </button>
      <span class="appeal-eyebrow" data-i18n="appeal.eyebrow">Cuenta suspendida</span>
      <h1 data-i18n="appeal.title">Solicita una revisión</h1>
      <p class="appeal-sub" data-i18n="appeal.sub">Si consideras que tu suspensión fue un error, cuéntanos qué pasó. Un administrador revisará tu caso.</p>

      <div id="appeal-toast"></div>

      <form class="appeal-form" id="appealForm">
        <div class="form-group">
          <label for="appealEmail" data-i18n="appeal.emailLabel">Correo de tu cuenta</label>
          <input type="email" id="appealEmail" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="appealMessage" data-i18n="appeal.messageLabel">Tu apelación</label>
          <textarea id="appealMessage" name="message" rows="5" maxlength="1000" required placeholder="Explica por qué crees que la suspensión debería revisarse…" data-i18n-attr="placeholder:appeal.messagePlaceholder"></textarea>
        </div>

        <button type="submit" class="appeal-submit" id="appealSubmitBtn" data-i18n="appeal.submit">Enviar apelación</button>
        <span class="appeal-status" id="appealStatus"></span>
      </form>

      <div class="appeal-sent" id="appealSent" hidden>
        <p data-i18n="appeal.sent">Tu apelación fue enviada. Un administrador la revisará pronto.</p>
        <a href="/" class="appeal-link" data-i18n="appeal.backHome">Volver al inicio</a>
      </div>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/apelar.js"></script>
</body>
</html>
