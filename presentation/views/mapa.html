<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salvadorean Roots — Mapa Cultural</title>

  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/mapa.css" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" />

  <link rel="icon" href="../assets/favicon/favicon.ico" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="navbar__logo">
      <a href="../views/index.html">
        <img src="../assets/media/Logo de Salvadorean Roots (Sin Fondo).png" alt="Logo Salvadorean Roots" />
      </a>
    </div>
    <ul class="navbar__links">
      <li><a href="../views/index.html">Inicio</a></li>
      <li><a href="../views/categorias.html">Categorías</a></li>
      <li><a href="mapa.html" class="active">Mapa</a></li>
      <li><a href="../views/calendario.html">Calendario</a></li>
    </ul>
    <button class="navbar__burger" id="burger" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-drawer__head"><span>Menú</span></div>
    <div class="drawer-section-label">Principal</div>
    <a href="../views/index.html" class="drawer-link">Inicio</a>
    <a href="../views/categorias.html" class="drawer-link">Categorías</a>
    <a href="mapa.html" class="drawer-link active">Mapa</a>
    <a href="../views/calendario.html" class="drawer-link">Calendario</a>
    <div class="drawer-divider"></div>
    <div class="drawer-auth">
      <p class="drawer-auth-label">Mi cuenta</p>
      <a href="../views/login.html" class="btn-login">Iniciar Sesión</a>
      <a href="../views/registro.html" class="btn-register">Registrarse</a>
    </div>
  </nav>

  <main>
    <section class="mapa-section reveal" style="transition-delay:.1s" id="mapaSection">
      <div id="mapa-leaflet"></div>

      <aside class="mapa-sidebar" id="mapaSidebar" aria-hidden="true">
        <button class="mapa-sidebar__close" id="sidebarClose" type="button" aria-label="Cerrar información">
          <svg viewBox="0 0 24 24"><path d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/></svg>
        </button>
        <div class="mapa-sidebar__hero">
          <div class="mapa-sidebar__image" id="sbImageWrap">
            <img id="sbImage" src="" alt="" />
            <span class="mapa-sidebar__emoji-badge" id="sbEmojiBadge"></span>
          </div>
          <p class="mapa-sidebar__cat" id="sbCat"></p>
          <h2 class="mapa-sidebar__title" id="sbTitle"></h2>
          <p class="mapa-sidebar__place">📍 <span id="sbPlace"></span></p>
        </div>
        <div class="mapa-sidebar__body">
          <div class="mapa-sidebar__divider"></div>
          <p class="mapa-sidebar__section-label">Descripción</p>
          <p class="mapa-sidebar__desc" id="sbDesc"></p>
          <p class="mapa-sidebar__section-label">Detalles</p>
          <div class="mapa-sidebar__chips" id="sbChips"></div>
          <div class="mapa-sidebar__actions">
            <button class="mapa-sidebar__btn primary" id="sbDirections" type="button">
              <svg viewBox="0 0 24 24"><path d="M21.71 11.29l-9-9a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 0 1.42l9 9a1 1 0 0 0 1.42 0l9-9a1 1 0 0 0 0-1.42zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/></svg>
              Cómo llegar
            </button>
            <button class="mapa-sidebar__btn" id="sbCenter" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3H23v2h-2.06A9.005 9.005 0 0 1 13 20.94V23h-2v-2.06A9.005 9.005 0 0 1 3.06 13H1v-2h2.06A9.005 9.005 0 0 1 11 3.06V1h2v2.06A9.005 9.005 0 0 1 20.94 11zM12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></svg>
              Centrar
            </button>
          </div>
        </div>
      </aside>

      <button class="mapa-back-btn" id="mapaBackBtn" type="button" style="display:none;">
        <span id="mapaBackBtnLabel">Volver</span>
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>

      <div class="mapa-filters-float" id="mapaFiltersFloat">
        <button class="filters-toggle" id="filtersToggle" type="button" aria-label="Ocultar filtros" aria-expanded="true" title="Mostrar/ocultar filtros">
          <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
        <div class="filters-list" id="filtersList">
          <button class="filter-btn active" data-cat="todas">
            <span class="filter-dot" style="background:#ffffff"></span> Todos
          </button>
          <button class="filter-btn" data-cat="cultural">
            <span class="filter-dot dot-cultural"></span> Sitios Culturales
          </button>
          <button class="filter-btn" data-cat="gastronomia">
            <span class="filter-dot dot-gastro"></span> Gastronomía
          </button>
          <button class="filter-btn" data-cat="evento">
            <span class="filter-dot dot-evento"></span> Eventos
          </button>
          <button class="filter-btn" data-cat="historia">
            <span class="filter-dot dot-historia"></span> Historia
          </button>
          <button class="filter-btn" data-cat="leyenda">
            <span class="filter-dot dot-leyenda"></span> Leyendas
          </button>
        </div>
      </div>
      <!-- Botón Flotante para Centrar Ubicación -->
      <button id="btn-mi-ubicacion" class="btn-geo-float" aria-label="Centrar en mi ubicación">
        <span class="btn-geo-float__icon">🎯</span>
      </button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/mapa.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
