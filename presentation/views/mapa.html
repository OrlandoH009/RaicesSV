<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="map.meta.title">Salvadorean Roots — Mapa Cultural</title>

  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/mapa.css" />
  <link rel="stylesheet" href="../assets/css/info-shared.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" />

  <link rel="icon" href="../assets/favicon/favicon.ico" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body data-i18n-title="map.meta.title">

  <nav class="navbar" id="navbar">
    <div class="navbar__logo">
      <a href="../views/index.html">
        <img src="../assets/media/Logo de Salvadorean Roots (Sin Fondo).png" alt="Logo Salvadorean Roots" />
      </a>
    </div>
    <ul class="navbar__links">
      <li><a href="../views/index.html" data-i18n="nav.inicio">Inicio</a></li>
      <li><a href="../views/categorias.html" data-i18n="nav.categorias">Categorías</a></li>
      <li><a href="mapa.html" class="active" data-i18n="nav.mapa">Mapa</a></li>
      <li><a href="../views/calendario.html" data-i18n="nav.calendario">Calendario</a></li>
    </ul>

    <!-- Botón de traducción (escritorio) -->
    <button class="lang-toggle" id="langToggleDesktop" data-lang-toggle type="button">
      <span class="lang-toggle__flag" data-lang-toggle-flag>🇸🇻</span>
    </button>

    <button class="navbar__burger" id="burger" data-i18n-attr="aria-label:nav.abrirMenu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-drawer__head"><span data-i18n="nav.menu">Menú</span></div>
    <div class="drawer-section-label" data-i18n="nav.principal">Principal</div>
    <a href="../views/index.html" class="drawer-link" data-i18n="nav.inicio">Inicio</a>
    <a href="../views/categorias.html" class="drawer-link" data-i18n="nav.categorias">Categorías</a>
    <a href="mapa.html" class="drawer-link active" data-i18n="nav.mapa">Mapa</a>
    <a href="../views/calendario.html" class="drawer-link" data-i18n="nav.calendario">Calendario</a>
    <div class="drawer-divider"></div>
    <div class="drawer-auth">
      <p class="drawer-auth-label" data-i18n="nav.miCuenta">Mi cuenta</p>
      <a href="../views/login.html" class="btn-login" data-i18n="nav.iniciarSesion">Iniciar Sesión</a>
      <a href="../views/registro.html" class="btn-register" data-i18n="nav.registrarse">Registrarse</a>
    </div>
  </nav>

  <a href="../views/categorias.html" class="info-back-btn" id="infoBackBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    <span id="infoBackBtnLabel">Volver a categorías</span>
  </a>

  <main>
    <section class="mapa-section reveal" style="transition-delay:.1s" id="mapaSection">
      <div id="mapa-leaflet"></div>

      <div class="mapa-filters-float" id="mapaFiltersFloat">
        <button class="filters-toggle" id="filtersToggle" type="button" data-i18n-attr="aria-label:map.filters.toggle" aria-expanded="true">
          <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
        <div class="filters-list" id="filtersList">
          <!-- Buscador -->
          <div class="search-wrapper">
            <input type="text" id="mapSearchInput" placeholder="Buscar lugar..." data-i18n-attr="placeholder:map.search.placeholder" />
            <button id="mapSearchClear" type="button" class="search-clear" style="display:none;">&times;</button>
          </div>
          <!-- Filtros -->
          <button class="filter-btn active" data-cat="todas">
            <span class="filter-dot" style="background:#ffffff"></span> <span data-i18n="map.filters.all">Todos</span>
          </button>
          <button class="filter-btn" data-cat="cultural">
            <span class="filter-dot dot-cultural"></span> <span data-i18n="nav.sitios">Sitios Culturales</span>
          </button>
          <button class="filter-btn" data-cat="gastronomia">
            <span class="filter-dot dot-gastro"></span> <span data-i18n="nav.gastronomia">Gastronomía</span>
          </button>
          <button class="filter-btn" data-cat="evento">
            <span class="filter-dot dot-evento"></span> <span data-i18n="nav.eventos">Eventos</span>
          </button>
          <button class="filter-btn" data-cat="historia">
            <span class="filter-dot dot-historia"></span> <span data-i18n="nav.historia">Historia</span>
          </button>
          <button class="filter-btn" data-cat="leyenda">
            <span class="filter-dot dot-leyenda"></span> <span data-i18n="nav.leyendas">Leyendas</span>
          </button>
        </div>
        <!-- 🔽 Lista de resultados de búsqueda (AHORA DENTRO DE LA BARRA) -->
        <div class="search-results-container" id="searchResultsContainer" style="display:none;">
          <ul class="search-results-list" id="searchResultsList"></ul>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="mapa-sidebar" id="mapaSidebar" aria-hidden="true">
        <button class="mapa-sidebar__close" id="sidebarClose" type="button" data-i18n-attr="aria-label:map.sidebar.close">
          <svg viewBox="0 0 24 24"><path d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/></svg>
        </button>
        <div class="mapa-sidebar__hero">
          <div class="mapa-sidebar__image" id="sbImageWrap">
            <img id="sbImage" src="" alt="" />
            <span class="mapa-sidebar__emoji-badge" id="sbEmojiBadge"></span>
          </div>
          <p class="mapa-sidebar__cat" id="sbCat"></p>
          <h2 class="mapa-sidebar__title" id="sbTitle"></h2>
          <p class="mapa-sidebar__place">📍 <span id="sbPlace"></span></p>
        </div>
        <div class="mapa-sidebar__body">
          <div class="mapa-sidebar__divider"></div>
          <p class="mapa-sidebar__section-label" data-i18n="map.sidebar.desc">Descripción</p>
          <p class="mapa-sidebar__desc" id="sbDesc"></p>
          <p class="mapa-sidebar__section-label" data-i18n="map.sidebar.details">Detalles</p>
          <div class="mapa-sidebar__chips" id="sbChips"></div>
          <div class="mapa-sidebar__actions">
            <button class="mapa-sidebar__btn primary" id="sbDirections" type="button">
              <svg viewBox="0 0 24 24"><path d="M21.71 11.29l-9-9a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 0 1.42l9 9a1 1 0 0 0 1.42 0l9-9a1 1 0 0 0 0-1.42zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/></svg>
              <span data-i18n="map.sidebar.directions">Cómo llegar</span>
            </button>
            <button class="mapa-sidebar__btn" id="sbCenter" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3H23v2h-2.06A9.005 9.005 0 0 1 13 20.94V23h-2v-2.06A9.005 9.005 0 0 1 3.06 13H1v-2h2.06A9.005 9.005 0 0 1 11 3.06V1h2v2.06A9.005 9.005 0 0 1 20.94 11zM12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></svg>
              <span data-i18n="map.sidebar.center">Centrar</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Botón Volver -->
      <button class="mapa-back-btn" id="mapaBackBtn" type="button" style="display:none;">
        <span id="mapaBackBtnLabel" data-i18n="map.backBtn">Volver</span>
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>

      <!-- Botón de geolocalización -->
      <button id="btn-mi-ubicacion" class="btn-geo-float" data-i18n-attr="aria-label:map.geo.label">
        <span class="btn-geo-float__icon">🎯</span>
      </button>
      
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/mapa.js"></script>
  <script src="../assets/js/back-nav.js" defer></script>
  <script src="../assets/js/script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../assets/js/theme-blobs.js"></script>
  <script src="../assets/js/i18n.js"></script>
</body>
</html>
