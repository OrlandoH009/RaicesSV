    /* ══════════════════════════════════════════════════════════
       INICIALIZACIÓN DEL MAPA CON LEAFLET
       (OpenStreetMap — completamente gratuito, sin API key)
       ══════════════════════════════════════════════════════════ */
    const mapa = L.map('mapa-leaflet', {
      center: [13.8, -88.95],
      zoom: 9,
      zoomControl: false,
      attributionControl: true
    });

    L.control.zoom({ position: 'bottomright' }).addTo(mapa);

    /* Tile layer oscuro (Carto Dark Matter — gratuito, sin API key) */
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(mapa);

    /* ── Crear ícono personalizado con emoji ── */
    function crearIcono(emoji, color) {
      return L.divIcon({
        className: '',
        html: `<div class="custom-marker" style="background:${color};">${emoji}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
      });
    }

    /* ── Colores de categoría para el texto del popup ── */
    const CAT_COLORS = {
      cultural:   '#be8e56',
      gastronomia:'#e05252',
      evento:     '#52a0e0',
      historia:   '#7c52e0',
      leyenda:    '#52c07c'
    };
    const CAT_LABELS = {
      cultural:   'Sitio Cultural',
      gastronomia:'Gastronomía',
      evento:     'Evento Cultural',
      historia:   'Historia',
      leyenda:    'Leyenda'
    };

    /* ── Renderizar popups y markers ── */
    const markers = [];

    LANDMARKS.forEach(lm => {
      const icono   = crearIcono(lm.emoji, lm.color);
      const chipsHtml = lm.chips.map(c => `<span class="popup-chip">${c}</span>`).join('');
      const popupContent = `
        <div class="popup-inner">
          <p class="popup-cat" style="color:${CAT_COLORS[lm.cat]}">${lm.emoji} ${CAT_LABELS[lm.cat]}</p>
          <h3 class="popup-title">${lm.nombre}</h3>
          <p class="popup-desc">${lm.desc}</p>
          <div>${chipsHtml}</div>
          <p style="font-size:.72rem;color:rgba(255,255,255,.35);margin-top:.6rem;font-family:'Lato',sans-serif;">📍 ${lm.lugar}</p>
        </div>`;

      const marker = L.marker(lm.coords, { icon: icono })
        .bindPopup(popupContent, { maxWidth: 280, minWidth: 220 })
        .addTo(mapa);

      marker._landmarkCat = lm.cat;
      marker._landmarkId  = lm.id;
      markers.push(marker);
    });

    /* ══════════════════════════════════════════════════════════
       DESTACAR LANDMARK BUSCADO (llega desde "Ver en mapa" /
       "Explorar en Mapa Interactivo" del Calendario, vía ?evento=ID)
       ══════════════════════════════════════════════════════════ */
    (function resaltarLandmarkDesdeURL() {
      const params = new URLSearchParams(window.location.search);
      const idParam = params.get('evento');
      if (!idParam) return;

      const targetId = parseInt(idParam, 10);
      const lm = LANDMARKS.find(l => l.id === targetId);
      const targetMarker = markers.find(m => m._landmarkId === targetId);
      if (!lm || !targetMarker) return;

      const iconoDestacado = L.divIcon({
        className: '',
        html: `
          <div class="custom-marker custom-marker--highlight" style="background:${lm.color};">
            ${lm.emoji}
            <span class="marker-pulse-ring"></span>
          </div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
      });

      targetMarker.setIcon(iconoDestacado);
      targetMarker.setZIndexOffset(1000);

      mapa.setView(lm.coords, 13, { animate: true });
      setTimeout(() => targetMarker.openPopup(), 550);
    })();

    /* ══════════════════════════════════════════════════════════
       FILTROS INTERACTIVOS
       ══════════════════════════════════════════════════════════ */
    let catActiva = 'todas';
    const countEl = document.getElementById('visibleCount');

    function actualizarFiltro(cat) {
      catActiva = cat;
      let visible = 0;

      markers.forEach(m => {
        if (cat === 'todas' || m._landmarkCat === cat) {
          m.addTo(mapa);
          visible++;
        } else {
          mapa.removeLayer(m);
        }
      });

      countEl.textContent = visible;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        actualizarFiltro(btn.dataset.cat);
      });
    });
  </script>
