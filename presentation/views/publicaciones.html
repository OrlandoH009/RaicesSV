<!-- ============================================================
     RAÍCES SV — Sección de Publicaciones
     Frontend interactivo con hover y navegación al mapa
     ============================================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicaciones - Raíces SV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/publicaciones.css">
</head>
<body>

  <!-- ════════════════════════════════════
       SECCIÓN DE PUBLICACIONES
       ════════════════════════════════════ -->
  <section class="publications-section">
    <div class="publications-container">
      <!-- Encabezado -->
      <div class="publications-header">
        <h1>Comparte la Magia de El Salvador</h1>
        <p>Descubre fotografías y historias de lugares increíbles compartidas por nuestra comunidad</p>
      </div>

      <!-- Grid de publicaciones -->
      <div class="publications-grid" id="publicationsGrid">
        <!-- Las publicaciones se cargarán aquí con JavaScript -->
      </div>

      <!-- Estado vacío (si no hay publicaciones) -->
      <div class="publications-empty" id="emptyState" style="display: none;">
        <div class="publications-empty-icon">📸</div>
        <p>No hay publicaciones aún</p>
        <p style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.3);">Sé el primero en compartir una publicación</p>
      </div>
    </div>
  </section>

  <!-- ════════════════════════════════════
       SECCIÓN DE CREAR PUBLICACIÓN
       ════════════════════════════════════ -->
  <section class="create-publication-section">
    <div class="create-publication-container">
      <div class="create-publication-header">
        <h2>Comparte tu Experiencia</h2>
        <p>Sube una foto y cuéntanos dónde capturaste la magia</p>
      </div>

      <form class="publication-form" id="publicationForm">
        <!-- Título -->
        <div class="form-group">
          <label for="pubTitle">Título del Lugar</label>
          <input type="text" id="pubTitle" placeholder="Ej: Cascada de Siete Pozos" required>
        </div>

        <!-- Descripción -->
        <div class="form-group">
          <label for="pubDescription">Descripción</label>
          <textarea id="pubDescription" placeholder="Describe tu experiencia en este lugar..." required></textarea>
        </div>

        <!-- Ubicación -->
        <div class="form-group">
          <label for="pubLocation">Ubicación</label>
          <select id="pubLocation" required>
            <option value="">Selecciona un lugar...</option>
            <option value="Tazumal">Tazumal (Chalchuapa, Santa Ana)</option>
            <option value="Joya de Cerén">Joya de Cerén (San Juan Opico, La Libertad)</option>
            <option value="Salvador del Mundo">Salvador del Mundo (San Salvador)</option>
            <option value="Suchitoto">Suchitoto (Cuscatlán)</option>
            <option value="Catedral Metropolitana">Catedral Metropolitana (San Salvador)</option>
            <option value="MUNA">MUNA (San Salvador)</option>
            <option value="Ruinas de San Andrés">Ruinas de San Andrés (Ciudad Arce, La Libertad)</option>
            <option value="El Boquerón">El Boquerón (Volcán de San Salvador, San Salvador)</option>
            <option value="Lago de Coatepeque">Lago de Coatepeque (Santa Ana)</option>
            <option value="Bosque El Imposible">Bosque El Imposible (Ahuachapán)</option>
            <option value="Puerta del Diablo">Puerta del Diablo (Los Planes de Renderos, Panchimalco)</option>
          </select>
        </div>

        <!-- Imagen -->
        <div class="form-group form-file-input">
          <label for="pubImage" class="form-file-label">
            <div class="form-file-icon">📷</div>
            <div class="form-file-text">Sube una foto</div>
            <div class="form-file-subtext">Arrastra o haz clic para seleccionar</div>
          </label>
          <input type="file" id="pubImage" accept="image/*" required>
          <div class="form-file-preview" id="imagePreview">
            <img id="previewImg" src="" alt="Preview">
            <button type="button" class="form-file-remove" id="removeImage">Eliminar imagen</button>
          </div>
        </div>

        <!-- Botones -->
        <div class="form-submit-group">
          <button type="submit" class="form-submit-btn">Publicar</button>
          <button type="reset" class="form-cancel-btn">Limpiar</button>
        </div>
      </form>
    </div>
  </section>


  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/publicaciones.js"></script>

</body>
</html>
