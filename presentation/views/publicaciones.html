<!-- ============================================================
     RAÍCES SV — Sección de Publicaciones
     Frontend interactivo con hover y navegación al mapa
     ============================================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicaciones - Raíces SV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ── */
    :root {
      --navy: #113068;
      --navy-dark: #0f2f66;
      --gold: #be8e56;
      --gold-hover: #a87a42;
      --cream: #e5eaff;
      --black: #1d1919;
      --white: #ffffff;
      --overlay: rgba(15, 47, 102, 0.45);
      --font-display: 'Playfair Display', serif;
      --font-body: 'Lato', sans-serif;
      --r-sm: 15px;
      --r-md: 25px;
    }

    /* ── Reset ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* ══════════════════════════════════
       SECCIÓN DE PUBLICACIONES
       ══════════════════════════════════ */

    .publications-section {
      min-height: 100vh;
      padding: 6rem 2rem 4rem;
      background: linear-gradient(135deg, #1d1919 0%, #2a2624 100%);
      position: relative;
    }

    .publications-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(to bottom, rgba(190, 142, 86, 0.08), transparent);
      pointer-events: none;
    }

    .publications-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .publications-header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
      z-index: 1;
    }

    .publications-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      color: var(--white);
      margin-bottom: 0.8rem;
    }

    .publications-header p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.7);
      max-width: 600px;
      margin: 0 auto;
    }

    .publications-header::after {
      content: '';
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.5rem auto 0;
      display: block;
    }

    /* ── Grid de publicaciones ── */
    .publications-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      position: relative;
      z-index: 2;
    }

    /* ── Tarjeta de publicación ── */
    .publication-card {
      background: rgba(29, 25, 25, 0.6);
      border: 1px solid rgba(190, 142, 86, 0.3);
      border-radius: var(--r-md);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .publication-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 12px 40px rgba(190, 142, 86, 0.25);
      background: rgba(29, 25, 25, 0.8);
    }

    .publication-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(190, 142, 86, 0.1) 0%, rgba(17, 48, 104, 0.05) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 1;
      pointer-events: none;
    }

    .publication-card:hover::before {
      opacity: 1;
    }

    /* ── Contenedor de imagen ── */
    .publication-image-container {
      position: relative;
      width: 100%;
      padding-top: 66.66%;
      overflow: hidden;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    }

    .publication-image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .publication-card:hover .publication-image-container img {
      transform: scale(1.08);
    }

    /* ── Overlay en imagen ── */
    .publication-image-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(17, 48, 104, 0.8));
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      padding: 1.5rem;
    }

    .publication-card:hover .publication-image-overlay {
      opacity: 1;
    }

    .publication-image-overlay-text {
      font-size: 0.9rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Contenido de la tarjeta ── */
    .publication-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    .publication-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }

    .publication-description {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 1.2rem;
      flex: 1;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Información de ubicación ── */
    .publication-location {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(190, 142, 86, 0.2);
    }

    .publication-location-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(190, 142, 86, 0.2);
      border-radius: 50%;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .publication-location-text {
      font-size: 0.9rem;
      color: var(--gold);
      font-weight: 600;
    }

    /* ── Botón de acción ── */
    .publication-action {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(190, 142, 86, 0.2);
    }

    .publication-btn {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
      color: var(--white);
      border: none;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .publication-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(190, 142, 86, 0.4);
    }

    .publication-btn:active {
      transform: translateY(0);
    }

    /* ── Estado vacío ── */
    .publications-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .publications-empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .publications-empty p {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    /* ══════════════════════════════════
       SECCIÓN DE FORMULARIO (CREAR PUBLICACIÓN)
       ══════════════════════════════════ */

    .create-publication-section {
      background: rgba(17, 48, 104, 0.5);
      border-top: 2px solid var(--gold);
      padding: 3rem 2rem;
      margin-top: 4rem;
    }

    .create-publication-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .create-publication-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .create-publication-header h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 0.5rem;
    }

    .create-publication-header p {
      color: rgba(255, 255, 255, 0.7);
    }

    /* ── Formulario ── */
    .publication-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--white);
      margin-bottom: 0.6rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 0.9rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(190, 142, 86, 0.3);
      border-radius: var(--r-sm);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(190, 142, 86, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* ── Input archivo ── */
    .form-file-input {
      position: relative;
    }

    .form-file-input input[type="file"] {
      display: none;
    }

    .form-file-label {
      display: block;
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(190, 142, 86, 0.15) 0%, rgba(17, 48, 104, 0.15) 100%);
      border: 2px dashed var(--gold);
      border-radius: var(--r-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .form-file-label:hover {
      background: linear-gradient(135deg, rgba(190, 142, 86, 0.25) 0%, rgba(17, 48, 104, 0.25) 100%);
      border-color: var(--gold-hover);
    }

    .form-file-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .form-file-text {
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .form-file-subtext {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
    }

    /* ── Preview de imagen ── */
    .form-file-preview {
      display: none;
      margin-top: 1rem;
      position: relative;
    }

    .form-file-preview img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: var(--r-sm);
      border: 1px solid rgba(190, 142, 86, 0.3);
    }

    .form-file-preview.show {
      display: block;
    }

    .form-file-remove {
      margin-top: 0.8rem;
      padding: 0.6rem 1rem;
      background: rgba(220, 53, 69, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .form-file-remove:hover {
      background: rgba(220, 53, 69, 0.3);
      border-color: #ff6b6b;
    }

    /* ── Botón enviar ── */
    .form-submit-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .form-submit-btn,
    .form-cancel-btn {
      flex: 1;
      padding: 1rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-submit-btn {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
      color: var(--white);
    }

    .form-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(190, 142, 86, 0.4);
    }

    .form-cancel-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .form-cancel-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* ══════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════ */

    @media (max-width: 768px) {
      .publications-section {
        padding: 4rem 1.5rem 3rem;
      }

      .publications-header {
        margin-bottom: 2.5rem;
      }

      .publications-header h1 {
        font-size: 2rem;
      }

      .publications-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .create-publication-section {
        padding: 2rem 1.5rem;
      }

      .create-publication-header h2 {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .publications-section {
        padding: 3rem 1rem 2rem;
      }

      .publications-header h1 {
        font-size: 1.5rem;
      }

      .publications-grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }

      .publication-title {
        font-size: 1.2rem;
      }

      .publication-description {
        font-size: 0.9rem;
      }

      .create-publication-section {
        padding: 1.5rem 1rem;
      }

      .create-publication-header h2 {
        font-size: 1.3rem;
      }

      .form-submit-group {
        flex-direction: column;
      }
    }

    /* ── Animaciones de aparición ── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .publication-card {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .publication-card:nth-child(1) { animation-delay: 0.1s; }
    .publication-card:nth-child(2) { animation-delay: 0.2s; }
    .publication-card:nth-child(3) { animation-delay: 0.3s; }
    .publication-card:nth-child(4) { animation-delay: 0.4s; }
    .publication-card:nth-child(5) { animation-delay: 0.5s; }
    .publication-card:nth-child(6) { animation-delay: 0.6s; }
  </style>
</head>
<body>

  <!-- ════════════════════════════════════
       SECCIÓN DE PUBLICACIONES
       ════════════════════════════════════ -->
  <section class="publications-section">
    <div class="publications-container">
      <!-- Encabezado -->
      <div class="publications-header">
        <h1>Comparte la Magia de El Salvador</h1>
        <p>Descubre fotografías y historias de lugares increíbles compartidas por nuestra comunidad</p>
      </div>

      <!-- Grid de publicaciones -->
      <div class="publications-grid" id="publicationsGrid">
        <!-- Las publicaciones se cargarán aquí con JavaScript -->
      </div>

      <!-- Estado vacío (si no hay publicaciones) -->
      <div class="publications-empty" id="emptyState" style="display: none;">
        <div class="publications-empty-icon">📸</div>
        <p>No hay publicaciones aún</p>
        <p style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.3);">Sé el primero en compartir una publicación</p>
      </div>
    </div>
  </section>

  <!-- ════════════════════════════════════
       SECCIÓN DE CREAR PUBLICACIÓN
       ════════════════════════════════════ -->
  <section class="create-publication-section">
    <div class="create-publication-container">
      <div class="create-publication-header">
        <h2>Comparte tu Experiencia</h2>
        <p>Sube una foto y cuéntanos dónde capturaste la magia</p>
      </div>

      <form class="publication-form" id="publicationForm">
        <!-- Título -->
        <div class="form-group">
          <label for="pubTitle">Título del Lugar</label>
          <input type="text" id="pubTitle" placeholder="Ej: Cascada de Siete Pozos" required>
        </div>

        <!-- Descripción -->
        <div class="form-group">
          <label for="pubDescription">Descripción</label>
          <textarea id="pubDescription" placeholder="Describe tu experiencia en este lugar..." required></textarea>
        </div>

        <!-- Ubicación -->
        <div class="form-group">
          <label for="pubLocation">Ubicación</label>
          <select id="pubLocation" required>
            <option value="">Selecciona un lugar...</option>
            <option value="Tazumal">Tazumal (Chalchuapa, Santa Ana)</option>
            <option value="Joya de Cerén">Joya de Cerén (San Juan Opico, La Libertad)</option>
            <option value="Salvador del Mundo">Salvador del Mundo (San Salvador)</option>
            <option value="Suchitoto">Suchitoto (Cuscatlán)</option>
            <option value="Catedral Metropolitana">Catedral Metropolitana (San Salvador)</option>
            <option value="MUNA">MUNA (San Salvador)</option>
            <option value="Ruinas de San Andrés">Ruinas de San Andrés (Ciudad Arce, La Libertad)</option>
            <option value="El Boquerón">El Boquerón (Volcán de San Salvador, San Salvador)</option>
            <option value="Lago de Coatepeque">Lago de Coatepeque (Santa Ana)</option>
            <option value="Bosque El Imposible">Bosque El Imposible (Ahuachapán)</option>
            <option value="Puerta del Diablo">Puerta del Diablo (Los Planes de Renderos, Panchimalco)</option>
          </select>
        </div>

        <!-- Imagen -->
        <div class="form-group form-file-input">
          <label for="pubImage" class="form-file-label">
            <div class="form-file-icon">📷</div>
            <div class="form-file-text">Sube una foto</div>
            <div class="form-file-subtext">Arrastra o haz clic para seleccionar</div>
          </label>
          <input type="file" id="pubImage" accept="image/*" required>
          <div class="form-file-preview" id="imagePreview">
            <img id="previewImg" src="" alt="Preview">
            <button type="button" class="form-file-remove" id="removeImage">Eliminar imagen</button>
          </div>
        </div>

        <!-- Botones -->
        <div class="form-submit-group">
          <button type="submit" class="form-submit-btn">Publicar</button>
          <button type="reset" class="form-cancel-btn">Limpiar</button>
        </div>
      </form>
    </div>
  </section>

  <script>
    // ════════════════════════════════════
    // DATOS DE EJEMPLO DE PUBLICACIONES
    // ════════════════════════════════════
    const publicationsData = [
      {
        id: 1,
        title: "Ruinas de Tazumal",
        description: "Una vista espectacular de las pirámides antiguas al atardecer. El lugar es perfecto para aprender sobre la historia prehispánica de El Salvador.",
        location: "Tazumal",
        image: "https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?w=500&h=350&fit=crop",
        coordinates: { lat: 13.9286, lng: -89.6469 }
      },
      {
        id: 2,
        title: "Cascada en Joya de Cerén",
        description: "Una cascada hermosa en medio de la naturaleza salvadoreña. Ideal para una caminata refrescante y conectar con la naturaleza.",
        location: "Joya de Cerén",
        image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500&h=350&fit=crop",
        coordinates: { lat: 13.8238, lng: -89.3953 }
      },
      {
        id: 3,
        title: "Atardecer en Salvador del Mundo",
        description: "Vistas panorámicas de San Salvador desde la cima del cerro. Un lugar perfecto para contemplar la ciudad y fotografiar el atardecer.",
        location: "Salvador del Mundo",
        image: "https://images.unsplash.com/photo-1469022563149-aa64dbd37cf0?w=500&h=350&fit=crop",
        coordinates: { lat: 13.7029, lng: -89.2073 }
      },
      {
        id: 4,
        title: "Pueblo Mágico de Suchitoto",
        description: "Las calles coloniales de Suchitoto son un viaje al pasado. Casas antiguas, arte y cultura en cada rincón.",
        location: "Suchitoto",
        image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=500&h=350&fit=crop",
        coordinates: { lat: 13.9417, lng: -88.7936 }
      },
      {
        id: 5,
        title: "Catedral Metropolitana",
        description: "La arquitectura religiosa más importante de El Salvador. Un lugar de paz y contemplación en el corazón de San Salvador.",
        location: "Catedral Metropolitana",
        image: "https://images.unsplash.com/photo-1485945371519-b21cc028cb2f?w=500&h=350&fit=crop",
        coordinates: { lat: 13.6929, lng: -89.2167 }
      },
      {
        id: 6,
        title: "Bosque El Imposible",
        description: "Una reserva natural con una biodiversidad increíble. Caminos entre árboles centenarios y aire puro de la naturaleza.",
        location: "Bosque El Imposible",
        image: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&h=350&fit=crop",
        coordinates: { lat: 13.8667, lng: -89.9333 }
      }
    ];

    // ════════════════════════════════════
    // RENDERIZAR PUBLICACIONES
    // ════════════════════════════════════
    function renderPublications() {
      const grid = document.getElementById('publicationsGrid');
      const emptyState = document.getElementById('emptyState');

      if (publicationsData.length === 0) {
        emptyState.style.display = 'block';
        grid.innerHTML = '';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = publicationsData.map(pub => `
        <article class="publication-card" data-location="${pub.location}" data-lat="${pub.coordinates.lat}" data-lng="${pub.coordinates.lng}">
          <div class="publication-image-container">
            <img src="${pub.image}" alt="${pub.title}" loading="lazy">
            <div class="publication-image-overlay">
              <span class="publication-image-overlay-text">Ver en mapa</span>
            </div>
          </div>
          <div class="publication-content">
            <h3 class="publication-title">${pub.title}</h3>
            <p class="publication-description">${pub.description}</p>
            <div class="publication-location">
              <div class="publication-location-icon">📍</div>
              <div class="publication-location-text">${pub.location}</div>
            </div>
            <div class="publication-action">
              <button class="publication-btn">Ir al Mapa</button>
            </div>
          </div>
        </article>
      `).join('');

      // Agregar event listeners a las tarjetas
      document.querySelectorAll('.publication-card').forEach(card => {
        card.addEventListener('click', handleCardClick);
      });
    }

    // ════════════════════════════════════
    // MANEJAR CLIC EN TARJETA
    // ════════════════════════════════════
    function handleCardClick(e) {
      // No ejecutar si se hace clic en el botón
      if (e.target.tagName === 'BUTTON') return;

      const card = e.currentTarget;
      const location = card.dataset.location;
      const lat = parseFloat(card.dataset.lat);
      const lng = parseFloat(card.dataset.lng);

      // Simular navegación al mapa interactivo
      console.log(`Navegando al mapa: ${location} (${lat}, ${lng})`);

      // En un proyecto real, esto sería:
      // window.location.href = `/mapa.html?location=${location}&lat=${lat}&lng=${lng}`;
      // O usar un evento personalizado:
      // window.dispatchEvent(new CustomEvent('navigateToMap', { detail: { location, lat, lng } }));

      // Para esta demo, mostrar un mensaje
      alert(`🗺️ Navegando a ${location}\nCoordenadas: ${lat}, ${lng}\n\n(En producción, esto te llevaría al mapa interactivo)`);
    }

    // ════════════════════════════════════
    // MANEJAR FORMULARIO
    // ════════════════════════════════════
    document.getElementById('publicationForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('pubTitle').value;
      const description = document.getElementById('pubDescription').value;
      const location = document.getElementById('pubLocation').value;
      const imageFile = document.getElementById('pubImage').files[0];

      if (!imageFile) {
        alert('Por favor sube una imagen');
        return;
      }

      // Crear URL de la imagen
      const imageUrl = URL.createObjectURL(imageFile);

      // Encontrar coordenadas del lugar (en producción, esto sería de una base de datos)
      const locationData = {
        'Tazumal': { lat: 13.9286, lng: -89.6469 },
        'Joya de Cerén': { lat: 13.8238, lng: -89.3953 },
        'Salvador del Mundo': { lat: 13.7029, lng: -89.2073 },
        'Suchitoto': { lat: 13.9417, lng: -88.7936 },
        'Catedral Metropolitana': { lat: 13.6929, lng: -89.2167 },
        'MUNA': { lat: 13.6952, lng: -89.2233 },
        'Ruinas de San Andrés': { lat: 13.8639, lng: -89.4317 },
        'El Boquerón': { lat: 13.6844, lng: -89.2272 },
        'Lago de Coatepeque': { lat: 13.8753, lng: -89.5417 },
        'Bosque El Imposible': { lat: 13.8667, lng: -89.9333 },
        'Puerta del Diablo': { lat: 13.6486, lng: -89.1403 }
      };

      const coords = locationData[location] || { lat: 13.6929, lng: -89.2167 };

      // Crear nueva publicación
      const newPublication = {
        id: publicationsData.length + 1,
        title,
        description,
        location,
        image: imageUrl,
        coordinates: coords
      };

      // Agregar al inicio del array
      publicationsData.unshift(newPublication);

      // Renderizar publicaciones
      renderPublications();

      // Limpiar formulario
      this.reset();
      document.getElementById('imagePreview').classList.remove('show');

      // Scroll a las publicaciones
      document.querySelector('.publications-section').scrollIntoView({ behavior: 'smooth' });

      // Mostrar mensaje de éxito
      alert('✅ ¡Publicación creada exitosamente!');
    });

    // ════════════════════════════════════
    // MANEJAR SUBIDA DE IMAGEN
    // ════════════════════════════════════
    document.getElementById('pubImage').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById('previewImg').src = event.target.result;
          document.getElementById('imagePreview').classList.add('show');
        };
        reader.readAsDataURL(file);
      }
    });

    // Botón para eliminar imagen
    document.getElementById('removeImage').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('pubImage').value = '';
      document.getElementById('imagePreview').classList.remove('show');
    });

    // ════════════════════════════════════
    // DRAG & DROP PARA IMAGEN
    // ════════════════════════════════════
    const fileLabel = document.querySelector('.form-file-label');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      fileLabel.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      fileLabel.addEventListener(eventName, () => {
        fileLabel.style.background = 'linear-gradient(135deg, rgba(190, 142, 86, 0.35) 0%, rgba(17, 48, 104, 0.35) 100%)';
        fileLabel.style.borderColor = '#a87a42';
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      fileLabel.addEventListener(eventName, () => {
        fileLabel.style.background = 'linear-gradient(135deg, rgba(190, 142, 86, 0.15) 0%, rgba(17, 48, 104, 0.15) 100%)';
        fileLabel.style.borderColor = '#be8e56';
      });
    });

    fileLabel.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      document.getElementById('pubImage').files = files;
      // Simular cambio de input
      document.getElementById('pubImage').dispatchEvent(new Event('change', { bubbles: true }));
    });

    // ════════════════════════════════════
    // INICIALIZAR
    // ════════════════════════════════════
    renderPublications();
  </script>

</body>
</html>
